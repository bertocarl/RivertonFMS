{% extends "base.html" %}
{% block title %}TotalEnergies Bonje &bull; {{ title }}{% endblock %}

{% block content %}
<!-- Header Navigation Breadcrumb -->
<div class="border-b border-slate-800 pb-5 mb-8">
  <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">
    <a href="/" class="hover:text-cyan-400 transition-colors">Control Center</a>
    <span>&rsaquo;</span>
    <span class="text-slate-400">{{ title }}</span>
  </div>
  <h1 class="text-2xl font-black tracking-tight text-white uppercase">{{ title }}</h1>
</div>

<!-- Main Glassmorphic Submission Container -->
<div class="max-w-xl">
  <form method="post" class="bg-slate-900/40 backdrop-blur-md border border-slate-800/80 p-6 sm:p-8 rounded-2xl shadow-xl">
    {% csrf_token %}
    
    <!-- Render Module for our Updated Form Matrix -->
    <div class="space-y-1">
      {% include "generic/_fields.html" %}
    </div>

    <!-- Interface Operational Controls -->
    <div class="flex flex-col sm:flex-row items-center gap-3 mt-8 pt-6 border-t border-slate-800/60">
      <button class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-sm font-bold text-white uppercase tracking-wider shadow-[0_0_20px_rgba(6,182,212,0.15)] hover:shadow-[0_0_25px_rgba(6,182,212,0.3)] transition-all duration-150 cursor-pointer text-center" type="submit">
        Commit Records
      </button>
      
      <a class="w-full sm:w-auto px-6 py-3 rounded-xl bg-slate-950 hover:bg-slate-900 border border-slate-800 hover:border-slate-700 text-sm font-bold text-slate-400 hover:text-slate-200 uppercase tracking-wider transition-all duration-150 text-center" href="{{ cancel_url }}">
        Abort Changes
      </a>
    </div>
  </form>
</div>
{% endblock %}
