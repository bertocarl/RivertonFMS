{% extends "base.html" %}
{% block title %}{{ phase }}{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">{{ phase }}s, shift {{ shift.code }}</h1>
<form method="post" class="panel max-w-xl">
  {% csrf_token %}
  {% include "generic/_fields.html" %}
  <p class="help mb-3">Enter litres from the dip chart. Leave a tank empty to skip it.</p>
  <div class="flex gap-3"><button class="btn btn-primary" type="submit">Save dips</button>
  <a class="btn" href="{% url 'shifts:detail' shift.pk %}">Cancel</a></div>
</form>
{% endblock %}
